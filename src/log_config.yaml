version: 1
disable_existing_loggers: false
filters:
  skip_health:
    "()": "src.log_filter.SkipHealthFilter"
formatters:
  json:
    "()": "pythonjsonlogger.json.JsonFormatter"
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  default:
    class: logging.StreamHandler
    formatter: json
    filters: [skip_health]
    stream: ext://sys.stderr
loggers:
  uvicorn.access:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.error:
    handlers: [default]
    level: INFO
    propagate: false
